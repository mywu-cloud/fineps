name: Update EPS Cache

on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 10,13 * * 1-5'

jobs:
  fetch-eps:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch EPS data from FinMind
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: node scripts/fetch-eps.js

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/eps-twse.json data/eps-tpex.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update EPS cache $(TZ='Asia/Taipei' date '+%Y-%m-%d %H:%M %Z')"
            git push
          fi
