<style>

*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:14px;background:var(--bg);color:var(--text);min-height:100vh;transition:background-color .2s,color .2s}

/* hide rank & industry, pin code + name while scrolling */
.tw th:nth-child(1),.tw td:nth-child(1),.tw th:nth-child(4),.tw td:nth-child(4){display:none}

.toast{left:12px;right:12px;bottom:16px;text-align:center}

</style>

<script>
var USE_LOCAL_PROXY=location.hostname.indexOf("pages.dev")>=0;var PROXY_LOCAL="/api/proxy?url=";var PROXY_EXT="https://corsproxy.io/?url=";
var TPRC="https://openapi.twse.com.tw/v1/exchangeReport/STOCK_DAY_ALL";
var TPEXC="https://www.tpex.org.tw/openapi/v1/tpex_mainboard_quotes";
var FINFO="https://api.finmindtrade.com/api/v4/data?dataset=TaiwanStockInfo";
var FEPS="https://api.finmindtrade.com/api/v4/data?dataset=TaiwanStockFinancialStatements&data_id=";
// Quarters are detected from the cached data at load time (see detectQuarters).
var LATEST_Q="--",LATEST_YEAR=0,LATEST_QN=0;
var EARLY_Q="--",EARLY_YEAR=0,EARLY_QN=0;
var EPS_CACHE={};
function cacheQMap(cacheJson,stockId){
if(!cacheJson||!cacheJson.stocks)return null;
var c=cacheJson.stocks[stockId];
if(!c||!c.quarters)return null;
var qMap={};
for(var k in c.quarters){
var v=c.quarters[k];
if(v==null)continue;
var parts=k.split("_");
qMap[k]={yr:parseInt(parts[0]),qn:parseInt(parts[1]),eps:v};
}
return qMap;
}
function hasQ(qMap,yr,qn){
return !!(qMap&&qMap[yr+"_"+qn]&&qMap[yr+"_"+qn].eps!=null);
}

var COLS=[
{k:"rank",lb:"#",al:"c"},
{k:"sid",lb:"代號",al:"c"},
{k:"name",lb:"名稱",al:"l"},
{k:"ind",lb:"產業",al:"l"},
{k:"close",lb:"收盤價",al:"r",dynLb:true},
{k:"chg",lb:"漲跌",al:"r"},
{k:"pct",lb:"漲跌幅",al:"r"},
{k:"eps",lb:"EPS(元)",al:"r"},
{k:"qoq",lb:"季增率",al:"r"},
{k:"yoy",lb:"年增率",al:"r"},
{k:"cumeps",lb:"累季EPS(元)",al:"r"},
{k:"cumy",lb:"累季年增率",al:"r"}
];
function getCols(){
var ql=(G.tab==="twseE"||G.tab==="tpexE")?EARLY_Q:LATEST_Q;
return COLS.map(function(c){if(c.k==="eps")return{k:c.k,lb:"EPS(元) "+ql,al:c.al,dynLb:c.dynLb};return c;});
}
var BAD=["ETF","存託憑證","特別股","受益憑證","指數股票型","債券","基金","創新板"];
var G={tab:"twse",rows:{twse:[],tpex:[],watch:[],twseE:[],tpexE:[]},sk:"eps",sd:"desc",ind:"",con:"",conMap:{},concepts:[],wl:[],dm:"",fEps:"",fQoq:"",fYoy:"",fCumy:"",px:{twse:{},tpex:{}},pxDate:{twse:"",tpex:""},epsUpdatedAt:"",msg:{}};
function initG(){try{G.wl=JSON.parse(localStorage.getItem("_tw_eps_w")||"[]");}catch(e){G.wl=[];}}
function px(u){return (USE_LOCAL_PROXY?PROXY_LOCAL:PROXY_EXT)+encodeURIComponent(u);}async function pfetch(u){if(!USE_LOCAL_PROXY)return fetch(PROXY_EXT+encodeURIComponent(u));try{var r=await fetch(PROXY_LOCAL+encodeURIComponent(u));if(r.ok||r.status===402)return r;throw new Error("proxy err "+r.status);}catch(e){return fetch(PROXY_EXT+encodeURIComponent(u));}}
function ok4(c){return /^[1-9][0-9]{3,4}$/.test(c);}
function okN(n){for(var i=0;i<BAD.length;i++){if(n.indexOf(BAD[i])>=0)return false;}return true;}
function pf(v){if(v==null||v==="")return null;var n=parseFloat(String(v).replace(/,/g,""));return isNaN(n)?null:n;}
function f2(v){if(v==null)return"--";return parseFloat(v).toLocaleString("zh-TW",{minimumFractionDigits:2,maximumFractionDigits:2});}
function fp(v){if(v==null)return"--";var n=parseFloat(v);return(n>0?"+":"")+n.toLocaleString("zh-TW",{minimumFractionDigits:2,maximumFractionDigits:2})+"%";}
function cc(v){if(v==null)return"nu";return v>0?"up":v<0?"dn":"nu";}
function qLabel(y,q){return (y%100)+"Q"+q;}
function spg(pct,msg){document.getElementById("pgb").style.width=pct+"%";document.getElementById("pg").style.display="block";var s=document.getElementById("st");s.textContent=msg;s.className="st ld";}
function cpg(msg){document.getElementById("pg").style.display="none";document.getElementById("pgb").style.width="0%";var s=document.getElementById("st");s.textContent=msg;s.className="st";}
function serr(msg){document.getElementById("pg").style.display="none";var s=document.getElementById("st");s.textContent=msg;s.className="st er";}
function showToast(msg){var t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");setTimeout(function(){t.classList.remove("show");},3000);}

function parseEpsData(data){
var qMap={};
for(var i=0;i<data.length;i++){
var d=data[i];
if(d.type!=="EPS")continue;
var dt=d.date||"";
var yr=parseInt(dt.slice(0,4));
var mo=parseInt(dt.slice(5,7));
var qn=mo<=3?1:mo<=6?2:mo<=9?3:4;
var key=yr+"_"+qn;
if(!qMap[key])qMap[key]={yr:yr,qn:qn,eps:pf(d.value)};
else if(d.value!=null)qMap[key].eps=pf(d.value);
}
return qMap;
}

function calcMetrics(qMap,yr,qn){
var cur=qMap[yr+"_"+qn];
if(!cur||cur.eps==null)return null;
var eps=cur.eps;
var pqY=qn>1?yr:yr-1, pqN=qn>1?qn-1:4;
var prevQ=qMap[pqY+"_"+pqN];
var qoq=(prevQ&&prevQ.eps!=null&&prevQ.eps!==0)?parseFloat(((eps-prevQ.eps)/Math.abs(prevQ.eps)*100).toFixed(2)):null;
var prevY=qMap[(yr-1)+"_"+qn];
var yoy=(prevY&&prevY.eps!=null&&prevY.eps!==0)?parseFloat(((eps-prevY.eps)/Math.abs(prevY.eps)*100).toFixed(2)):null;
var cumEps=0, cumEpsPY=0, cumOk=true, cumPYOk=true;
for(var q=1;q<=qn;q++){
var cq=qMap[yr+"_"+q];
if(cq&&cq.eps!=null)cumEps+=cq.eps; else cumOk=false;
var pq=qMap[(yr-1)+"_"+q];
if(pq&&pq.eps!=null)cumEpsPY+=pq.eps; else cumPYOk=false;
}
var cumy=(cumOk&&cumPYOk&&cumEpsPY!==0)?parseFloat(((cumEps-cumEpsPY)/Math.abs(cumEpsPY)*100).toFixed(2)):null;
return{eps:eps,qoq:qoq,yoy:yoy,cumEps:cumOk?parseFloat(cumEps.toFixed(2)):null,cumy:cumy};
}
// ---- Data loading: cache-first ------------------------------------------
// All tables are built from the JSON snapshots that GitHub Actions maintains
// (data/eps-*.json, data/prices.json). No per-stock FinMind requests are made
// while browsing; FinMind is only queried for a watch-list code or a detail
// modal whose stock is not in the cache.
var BASE=null;
function hourTag(){return Math.floor(Date.now()/3600000);}
function loadEpsCache(type){
if(EPS_CACHE[type])return EPS_CACHE[type];
EPS_CACHE[type]=fetch("data/eps-"+type+".json?d="+hourTag()).then(function(r){return r.ok?r.json():null;}).catch(function(){return null;});
return EPS_CACHE[type];
}
function loadPricesJson(){
return fetch("data/prices.json?d="+hourTag()).then(function(r){return r.ok?r.json():null;}).catch(function(){return null;});
}
function qNum(k){var p=k.split("_");return parseInt(p[0],10)*10+parseInt(p[1],10);}
// Main quarter = newest quarter reported by at least half of the market
// (same rule as scripts/fetch-eps.js). The early (搶先報) quarter is the next one.
function detectQuarters(caches){
var cov={},total=0;
caches.forEach(function(c){
if(!c||!c.stocks)return;
for(var id in c.stocks){total++;var qs=c.stocks[id].quarters||{};for(var k in qs){if(qs[k]!=null)cov[k]=(cov[k]||0)+1;}}
});
var best=null;
Object.keys(cov).forEach(function(k){if(cov[k]>=total*0.5&&(!best||qNum(k)>qNum(best)))best=k;});
if(!best){var tw=new Date(Date.now()+8*3600000),y=tw.getUTCFullYear(),q=Math.floor(tw.getUTCMonth()/3);if(q<1){q=4;y--;}best=y+"_"+q;}
var p=best.split("_");
LATEST_YEAR=parseInt(p[0],10);LATEST_QN=parseInt(p[1],10);LATEST_Q=qLabel(LATEST_YEAR,LATEST_QN);
EARLY_QN=LATEST_QN+1;EARLY_YEAR=LATEST_YEAR;if(EARLY_QN>4){EARLY_QN=1;EARLY_YEAR++;}
EARLY_Q=qLabel(EARLY_YEAR,EARLY_QN);
}
function ensureBase(){
if(BASE)return BASE;
spg(20,"讀取 EPS 與股價快取...");
BASE=Promise.all([loadEpsCache("twse"),loadEpsCache("tpex"),loadPricesJson()]).then(function(res){
if(!res[0]&&!res[1])throw new Error("無法讀取 EPS 快取（data/eps-*.json）");
detectQuarters([res[0],res[1]]);
var pj=res[2]||{};
["twse","tpex"].forEach(function(mk){if(pj[mk]&&pj[mk].p)applyPrices(mk,pj[mk].p,pj[mk].date||"");});
G.epsUpdatedAt=(res[0]&&res[0].updatedAt)||(res[1]&&res[1].updatedAt)||"";
return {twse:res[0],tpex:res[1]};
});
BASE.catch(function(){BASE=null;});
return BASE;
}

// ---- Prices ---------------------------------------------------------------
// G.px[market][code]={close,chg,pct}; G.pxDate[market]="YYYY-MM-DD"
function applyPrices(mk,map,date){
if(G.pxDate[mk]&&date&&date<G.pxDate[mk])return false;
var out={};
for(var code in map){var v=map[code],cl=v[0],ch=v[1],cp=null;
if(cl!=null&&ch!=null&&ch!==0){var pv=cl-ch;if(pv!==0)cp=parseFloat((ch/Math.abs(pv)*100).toFixed(2));}else if(ch===0)cp=0;
out[code]={close:cl,chg:ch,pct:cp};}
G.px[mk]=out;G.pxDate[mk]=date||G.pxDate[mk]||"";
return true;
}
function rocToIso(s){s=String(s||"").trim();if(!/^\d{7}$/.test(s))return"";return(parseInt(s.slice(0,3),10)+1911)+"-"+s.slice(3,5)+"-"+s.slice(5,7);}
// One bulk request per market to pick up prices newer than the snapshot.
var LIVE_PX={};
function refreshLivePrices(mk){
if(LIVE_PX[mk])return LIVE_PX[mk];
var url=mk==="twse"?TPRC:TPEXC;
// TPEx's OpenAPI intermittently answers with an HTML error page -> retry a few times.
function getArr(n){return pfetch(url).then(function(r){return r.json();}).then(function(a){if(!Array.isArray(a)||!a.length)throw new Error("empty");return a;}).catch(function(e){if(n<=1)throw e;return new Promise(function(res){setTimeout(res,2000);}).then(function(){return getArr(n-1);});});}
LIVE_PX[mk]=getArr(4).then(function(arr){
if(!Array.isArray(arr))return;
var map={},date="";
arr.forEach(function(x){
var code=String(mk==="twse"?x.Code:x.SecuritiesCompanyCode||"").trim();if(!ok4(code))return;
var cl=pf(mk==="twse"?x.ClosingPrice:x.Close);if(cl==null||cl<=0)return;
map[code]=[cl,pf(x.Change)];var d=rocToIso(x.Date);if(d>date)date=d;
});
if(!Object.keys(map).length)return;
if(applyPrices(mk,map,date)){
[mk,mk+"E"].forEach(function(t){(G.rows[t]||[]).forEach(setRowPrice.bind(null,mk));});
(G.rows.watch||[]).forEach(function(r){setRowPrice(r.mk||"twse",r);});
if(G.rows[G.tab]&&G.rows[G.tab].length)renderTable(getRows());
}
}).catch(function(e){console.warn("live price refresh failed",mk,e);});
return LIVE_PX[mk];
}
function setRowPrice(mk,r){var p=(G.px[mk]||{})[r.sid]||(G.px[mk==="twse"?"tpex":"twse"]||{})[r.sid];r.close=p?p.close:null;r.chg=p?p.chg:null;r.pct=p?p.pct:null;}
function curMarket(){return G.tab==="tpex"||G.tab==="tpexE"?"tpex":"twse";}
function pxDateLabel(){var d=G.pxDate[curMarket()]||"";return d?d.slice(5,7)+"/"+d.slice(8,10):"";}

// ---- Table builders ---------------------------------------------------------
function buildRows(mk,cache,yr,qn){
var rows=[],key=yr+"_"+qn;
if(!cache||!cache.stocks)return rows;
for(var id in cache.stocks){
if(!ok4(id))continue;
var s=cache.stocks[id];
if(!okN(s.name||"")||!okN(s.industry||""))continue;
var qMap=cacheQMap(cache,id);
var m=qMap&&calcMetrics(qMap,yr,qn);
if(!m)continue;
var r={sid:id,mk:mk,name:s.name||id,ind:s.industry||"",est:!!(s.est&&s.est[key]),
eps:m.eps,qoq:m.qoq,yoy:m.yoy,cumeps:m.cumEps,cumy:m.cumy};
setRowPrice(mk,r);
rows.push(r);
}
return rows;
}

// NEW: SVG bar chart for EPS history
function renderEpsChart(hist){
if(!hist||!hist.length)return'<div class="em" style="padding:20px">無歷史資料</div>';
// Show up to 12 most recent quarters (hist is newest-first)
var data=hist.slice(0,12).reverse(); // now oldest-first for chart
var W=760,H=160,PL=36,PR=10,PT=10,PB=32;
var cW=W-PL-PR,cH=H-PT-PB;
var eps=data.map(function(d){return d.eps!=null?d.eps:0;});
var mn=Math.min.apply(null,eps),mx=Math.max.apply(null,eps);
var hasNeg=mn<0;
// Add some padding to range
var range=mx-mn||1;
var yMin=hasNeg?mn-range*0.1:Math.min(0,mn);
var yMax=mx+range*0.1;
var yRange=yMax-yMin||1;
var n=data.length;
var bW=Math.floor((cW-n*2)/(n||1));
var bGap=Math.floor((cW-bW*n)/(n+1));
// Zero line Y position
var zeroY=PT+cH-(0-yMin)/yRange*cH;
var svg='<svg width="100%" viewBox="0 0 '+W+' '+H+'" style="display:block;overflow:visible" xmlns="http://www.w3.org/2000/svg">';
// Grid lines
var gridVals=[];
var step=range/3;
for(var g=0;g<=3;g++)gridVals.push(yMin+step*g);
gridVals.forEach(function(gv){
var gy=PT+cH-(gv-yMin)/yRange*cH;
svg+='<line x1="'+PL+'" y1="'+gy.toFixed(1)+'" x2="'+(W-PR)+'" y2="'+gy.toFixed(1)+'" style="stroke:var(--ch-grid)" stroke-width="1"/>';
var gl=gv>=0?(gv>0?"+":"")+gv.toFixed(1):gv.toFixed(1);
svg+='<text x="'+(PL-4)+'" y="'+(gy+4).toFixed(1)+'" text-anchor="end" font-size="10" style="fill:var(--ch-axis)">'+gl+'</text>';
});
// Zero line if range includes negative
if(hasNeg){
svg+='<line x1="'+PL+'" y1="'+zeroY.toFixed(1)+'" x2="'+(W-PR)+'" y2="'+zeroY.toFixed(1)+'" style="stroke:var(--ch-zero)" stroke-width="1" stroke-dasharray="3,2"/>';
}
// Bars
for(var i=0;i<n;i++){
var d=data[i];
var v=d.eps!=null?d.eps:0;
var x=PL+bGap+i*(bW+bGap);
var barH=Math.abs(v-0)/yRange*cH;
var barY=v>=0?PT+cH-(v-yMin)/yRange*cH:zeroY;
if(v<0)barH=Math.abs(v)/yRange*cH;
var color=v>=0?"var(--ch-pos)":"var(--ch-neg)";
svg+='<rect x="'+x.toFixed(1)+'" y="'+barY.toFixed(1)+'" width="'+bW+'" height="'+Math.max(1,barH).toFixed(1)+'" style="fill:'+color+'" rx="2" opacity="0.85"/>';
// EPS value label on bar
var labelY=v>=0?(barY-3).toFixed(1):(barY+barH+11).toFixed(1);
if(barH>14){labelY=v>=0?(barY+12).toFixed(1):(barY+barH-3).toFixed(1);}
svg+='<text x="'+(x+bW/2).toFixed(1)+'" y="'+labelY+'" text-anchor="middle" font-size="9" style="fill:'+color+'" font-weight="600">'+v.toFixed(2)+'</text>';
// X axis label
var lx=(x+bW/2).toFixed(1);
var ly=(PT+cH+PB-4).toFixed(1);
svg+='<text x="'+lx+'" y="'+ly+'" text-anchor="middle" font-size="10" style="fill:var(--ch-label)">'+d.label+'</text>';
}
svg+='</svg>';
return svg;
}

var prevY=qMap[(y-1)+"_"+qn];

hist.push({label:qLabel(y,qn),yr:y,qn:qn,eps:q.eps,qoq:qoq,yoy:yoy});
}
}

}

return hist.filter(function(h){return h.yr===yr;});
}

function scheduleRefresh(){
var now=new Date();
var tw=new Date(now.getTime()+8*3600000);
var h=tw.getUTCHours(),m=tw.getUTCMinutes(),s=tw.getUTCSeconds();
var targets=[19,20];
var msUntilNext=null;
for(var i=0;i<targets.length;i++){
var diff=(targets[i]-h)*3600000-m*60000-s*1000;
if(diff>0&&(msUntilNext===null||diff<msUntilNext))msUntilNext=diff;
}
if(msUntilNext===null)msUntilNext=(43-h)*3600000-m*60000-s*1000;
setTimeout(function(){resetCaches();loadData();scheduleRefresh();},msUntilNext);
}
scheduleRefresh();
});
